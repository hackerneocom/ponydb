name: Rust
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate
        type: string
        required: false
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-26.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.os }}
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo run --locked -p engine-sqlite --example diagnostics
      - name: Test release tooling
        run: python -m unittest discover -s tests/release -v
  e2e:
    name: CLI, server and MCP end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      E2E_ENDPOINT: http://127.0.0.1:9000
      E2E_BUCKET: ponydb-test
      E2E_REGION: us-east-1
      E2E_CLI: ${{ github.workspace }}/target/debug/ponydb
      ACCESS_KEY: rustfsadmin
      SECRET_KEY: rustfsadmin
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ubuntu-24.04
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Start isolated RustFS
        id: rustfs
        run: |
          docker run --detach --name ponydb-e2e-rustfs \
            --publish 127.0.0.1:9000:9000 \
            --env RUSTFS_ADDRESS=:9000 \
            --env RUSTFS_CONSOLE_ENABLE=false \
            --env RUSTFS_ACCESS_KEY="$ACCESS_KEY" \
            --env RUSTFS_SECRET_KEY="$SECRET_KEY" \
            rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2 \
            /data
      - name: Wait for storage and create test bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ env.ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ env.SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ env.E2E_REGION }}
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_PAGER: ""
        run: |
          curl --fail --silent --show-error \
            --retry 30 --retry-connrefused --retry-delay 1 --retry-max-time 90 \
            --connect-timeout 2 --max-time 5 "$E2E_ENDPOINT/health"
          aws --endpoint-url "$E2E_ENDPOINT" s3api create-bucket \
            --bucket "$E2E_BUCKET" --region "$E2E_REGION"
      - name: Build CLI
        run: cargo build --locked -p ponydb
      - name: Run all end-to-end tests
        timeout-minutes: 10
        run: python3 tests/cli_e2e.py
      - name: Show RustFS logs on failure
        if: ${{ failure() && steps.rustfs.outcome == 'success' }}
        run: docker logs ponydb-e2e-rustfs
      - name: Remove RustFS and its temporary volumes
        if: ${{ always() }}
        run: docker rm --force --volumes ponydb-e2e-rustfs || true
  docker:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          push: false
          tags: ponydb:ci
          cache-from: type=gha,scope=ponydb-docker
          cache-to: type=gha,scope=ponydb-docker,mode=max
      - run: docker run --rm ponydb:ci version
      - run: docker run --rm --entrypoint ponydb ponydb:ci version
